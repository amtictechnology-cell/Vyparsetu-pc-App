<div class="split-layout">
  <!-- Left Panel -->
  <div class="left-panel">
    <div class="brand-content">
      <img src="assets/Logo.png" alt="Logo" class="brand-logo" />
      <h1 class="brand-tagline">Secure Account Recovery</h1>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="auth-card">
      <div class="auth-header">
        <div class="icon-bubble">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>Forgot Password?</h2>
        <p>No worries! Enter your registered email address and we'll send you a 6-digit verification code to reset your password.</p>
      </div>

      <form (ngSubmit)="onSubmit(forgotForm)" #forgotForm="ngForm" class="auth-form">
        <!-- Email -->
        <div class="form-group">
          <label for="email">Registered Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email" 
            required 
            email
            placeholder="e.g. ashish@example.com"
            #emailInput="ngModel"
            [disabled]="loading"
          />
          <div class="error-text" *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
            Please enter a valid email address.
          </div>
        </div>

        <!-- Feedback Alerts -->
        <div class="alert alert-error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        <div class="alert alert-success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="forgotForm.invalid || loading">
          <span *ngIf="!loading">Send Verification Code</span>
          <span *ngIf="loading">Sending OTP...</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Remembered your password? <a routerLink="/login">Back to Login</a></p>
      </div>
    </div>
  </div>
</div>

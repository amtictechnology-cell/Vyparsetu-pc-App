<div class="split-layout">
  <!-- Left Panel -->
  <div class="left-panel">
    <div class="brand-content">
      <img src="assets/Logo.png" alt="Logo" class="brand-logo" />
      <h1 class="brand-tagline">Everything You Need to Run Your Business</h1>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Login to your VyparSetu account</p>
      </div>

      <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" class="auth-form">
        
        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="credentials.email" 
            required 
            email
            placeholder="e.g. ashish@example.com"
            #email="ngModel"
          />
          <div class="error-text" *ngIf="email.invalid && (email.dirty || email.touched)">
            Please enter a valid email address.
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="credentials.password" 
            required 
            placeholder="Enter your password"
            #password="ngModel"
          />
          <div class="error-text" *ngIf="password.invalid && (password.dirty || password.touched)">
            Password is required.
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div class="forgot-row">
          <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Alerts -->
        <div class="alert alert-error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || loading">
          <span *ngIf="!loading">Login</span>
          <span *ngIf="loading">Logging in...</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/signup">Sign up here</a></p>
      </div>
    </div>
  </div>
</div>

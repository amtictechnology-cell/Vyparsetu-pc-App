<div class="info-wrapper">
  <div class="info-card">
    <div class="info-header">
      <h3>Complete Your Profile</h3>
      <p>Help us set up your VyparSetu business account on desktop</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="name">Your Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="Enter your full name" 
          [(ngModel)]="name"
          required
          autocomplete="off"
        />
      </div>

      <div class="input-group">
        <label for="businessName">Business Name</label>
        <input 
          type="text" 
          id="businessName" 
          name="businessName" 
          placeholder="Enter business name" 
          [(ngModel)]="businessName"
          required
          autocomplete="off"
        />
      </div>

      <div class="input-group">
        <label>Business Category</label>
        <div class="category-cards">
          <div 
            class="category-card" 
            [class.active]="category === 'Hotel'"
            (click)="selectCategory('Hotel')"
          >
            <span class="category-icon">🏨</span>
            <span class="category-label">Hotel</span>
          </div>

          <div 
            class="category-card" 
            [class.active]="category === 'Shop'"
            (click)="selectCategory('Shop')"
          >
            <span class="category-icon">🛍️</span>
            <span class="category-label">Shop</span>
          </div>

          <div 
            class="category-card" 
            [class.active]="category === 'Supplier'"
            (click)="selectCategory('Supplier')"
          >
            <span class="category-icon">🚚</span>
            <span class="category-label">Supplier</span>
          </div>
        </div>
      </div>

      <div class="error-box" *ngIf="errorMessage">
        <span>⚠️</span> {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="!isFormValid() || loading"
      >
        <span *ngIf="!loading">Save & Start Exploring</span>
        <span *ngIf="loading" class="btn-spinner"></span>
      </button>
    </form>
  </div>
</div>

      <div class="animate-fade-in" style="display: flex; flex-direction: column; gap: 2rem; padding: 1rem 0;">
        
        <!-- Stats Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; width: 100%; box-sizing: border-box;">
          
          <!-- Card 1: Total Customers -->
          <div style="background: #ffffff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(0, 89, 255, 0.06); border: 1.5px solid rgba(0, 89, 255, 0.1); display: flex; align-items: center; justify-content: space-between; min-height: 95px; box-sizing: border-box;">
            <div style="text-align: left; display: flex; flex-direction: column; justify-content: center;">
              <h2 style="margin: 0; font-size: 1.8rem; font-weight: 700; color: #1e293b; line-height: 1;">
                {{ (billingCustomers?.length || 0) + (stayCustomers?.length || 0) }}
              </h2>
              <span style="color: #64748b; font-size: 0.88rem; font-weight: 550; margin-top: 4px; display: block;">Customers</span>
            </div>
            <div style="color: #ff6600; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; opacity: 0.8;">
              <i class="fa-solid fa-users"></i>
            </div>
          </div>

          <!-- Card 2: Total Staff -->
          <div style="background: #ffffff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(0, 89, 255, 0.06); border: 1.5px solid rgba(0, 89, 255, 0.1); display: flex; align-items: center; justify-content: space-between; min-height: 95px; box-sizing: border-box;">
            <div style="text-align: left; display: flex; flex-direction: column; justify-content: center;">
              <h2 style="margin: 0; font-size: 1.8rem; font-weight: 700; color: #1e293b; line-height: 1;">
                {{ staffList?.length || 0 }}
              </h2>
              <span style="color: #64748b; font-size: 0.88rem; font-weight: 550; margin-top: 4px; display: block;">Staff</span>
            </div>
            <div style="color: #ff6600; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; opacity: 0.8;">
              <i class="fa-solid fa-clipboard-list"></i>
            </div>
          </div>

          <!-- Card 3: Total Bills (Random Data) -->
          <div style="background: #ffffff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(0, 89, 255, 0.06); border: 1.5px solid rgba(0, 89, 255, 0.1); display: flex; align-items: center; justify-content: space-between; min-height: 95px; box-sizing: border-box;">
            <div style="text-align: left; display: flex; flex-direction: column; justify-content: center;">
              <h2 style="margin: 0; font-size: 1.8rem; font-weight: 700; color: #1e293b; line-height: 1;">
                142
              </h2>
              <span style="color: #64748b; font-size: 0.88rem; font-weight: 550; margin-top: 4px; display: block;">Bills</span>
            </div>
            <div style="color: #ff6600; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; opacity: 0.8;">
              <i class="fa-solid fa-receipt"></i>
            </div>
          </div>

        </div>

        <!-- Welcome Business Name Text -->
        <div style="text-align: center; margin-top: 4.5rem; padding: 2rem 0; width: 100%;">
          <span style="font-size: 0.9rem; color: #64748b; font-weight: 750; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; display: block;">Welcome to</span>
          <h1 style="margin: 0; font-family: 'Outfit', 'Inter', sans-serif; font-size: 2.8rem; font-weight: 900; color: #1e293b; letter-spacing: -0.5px; line-height: 1.25;">
            {{ user?.businessName || 'My Business' }}
          </h1>
          <div style="width: 65px; height: 4px; background: #0059ff; margin: 1.25rem auto 1rem auto; border-radius: 2px;"></div>
          <p style="margin: 0; color: #64748b; font-size: 1.05rem; font-weight: 650;">Insights & Management Dashboard</p>
        </div>

      </div>
